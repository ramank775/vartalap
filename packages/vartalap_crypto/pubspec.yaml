name: vartalap_crypto
description: End-to-end encryption for Vartalap v3 (Signal sessions over encrypted local records).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  # our patched copy (decisions 260, 261)
  libsignal_protocol_dart:
    path: ../libsignal_protocol_dart
  pointycastle: ^4.0.0
  sqflite_common_ffi: ^2.3.0
  vartalap_proto:
    path: ../vartalap_proto
  vartalap_transport:
    path: ../vartalap_transport

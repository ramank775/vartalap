name: libsignal_protocol_dart
description: Signal Protocol libray for Dart native and Flutter, pure Dart implementation of the the Signal Protocol
version: 0.8.2+vartalap.1
# Vartalap's copy of libsignal_protocol_dart 0.8.2 (GPL-3.0, as Vartalap),
# patched (decision 261): SessionState.fromSessionState deep-copies, and a
# state promoted on decrypt leaves the archive, as libsignal (Java) does.
publish_to: none
repository: https://github.com/MixinNetwork/libsignal_protocol_dart
topics:
 - crypto

environment:
  sdk: '>=3.4.0 <4.0.0'


dependencies:
  adaptive_number: ^1.0.0
  collection: ^1.19.0
  convert: ^3.1.2
  crypto: ^3.0.6
  ed25519_edwards: ^0.3.1
  fixnum: ^1.1.1
  meta: ^1.16.0
  optional: ^6.1.0+1
  pointycastle: ^4.0.0
  protobuf: ^6.0.0
  x25519: ^0.1.1

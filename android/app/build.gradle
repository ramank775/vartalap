plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if(keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.one9x.vartalap"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }


    defaultConfig {
        applicationId "com.one9x.vartalap"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        
        debug {
            signingConfig signingConfigs.release
        }
    }
    
    // Variants are app x push: devFoss, devGms, prodFoss, prodGms.
    flavorDimensions += ["app", "push"]

    productFlavors {
        
        dev {
            dimension "app"
            resValue "string", "app_name", "Vartalap Dev"
            versionNameSuffix "-dev"
            applicationId "com.one9x.vartalap.dev"
        }

        prod {
            dimension "app"
            resValue "string", "app_name", "Vartalap"
        }

        // No Google code at all (F-Droid, GitHub). V3_ARCHITECTURE
        // decision 1; scripts/degoogle_gate.sh and the CI dex check
        // hold it to that.
        foss {
            dimension "push"
        }

        // Adds only Firebase Cloud Messaging, for opt-in Google push
        // (GitHub, Play Store). DECISIONS 121, 209.
        gms {
            dimension "push"
        }
    }
    lint {
        disable 'InvalidPackage'
    }
}

flutter {
    source '../..'
}

// Decision 209: Google push needs the Firebase config, which is not in git
// (see .gitignore). A Play release without it would build fine and never
// offer Google push, so refuse to build one.
tasks.configureEach { task ->
    if (task.name == 'preProdGmsReleaseBuild') {
        task.doFirst {
            if (!file('src/prodGms/res/values/firebase.xml').exists()) {
                throw new GradleException(
                    'src/prodGms/res/values/firebase.xml is missing: generate it from ' +
                    'the Android config file in the Firebase console (decision 209)')
            }
        }
    }
}

// The UnifiedPush connector ships Tink for Android (WebPush payload
// crypto — Apache-2.0, no Play Services); `webcrypto` pulls the JVM
// build of the same library, and the two collide at dex time on every
// class. Upstream's documented fix: substitute one for the other.
configurations.all {
    resolutionStrategy {
        def tinkAndroid = 'com.google.crypto.tink:tink-android:1.19.0'
        force tinkAndroid
        dependencySubstitution {
            substitute module('com.google.crypto.tink:tink') using module(tinkAndroid)
        }
    }
}

dependencies {
    // Decision 209: Google push is native Firebase Cloud Messaging, so the
    // server sends a data-only, high-priority FCM message. PushService
    // offers it as "Google Play services"; foss builds keep only UnifiedPush.
    gmsImplementation 'com.google.firebase:firebase-messaging:25.1.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

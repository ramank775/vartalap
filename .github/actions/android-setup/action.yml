name: "Android build setup"
description: "Flutter, Java 17 and the NDK, with the Flutter SDK, pub, Gradle and NDK cached between runs; then pub get."
inputs:
  flutter-version:
    description: "Flutter version"
    required: true
runs:
  using: "composite"
  steps:
    - uses: subosito/flutter-action@v2
      with:
        channel: "stable"
        flutter-version: ${{ inputs.flutter-version }}
        cache: true
        # Its own key: the cache saved after a build holds the Android engine
        # files, which the test job's Flutter cache never downloads.
        cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:-android"
    - uses: actions/setup-java@v6
      with:
        distribution: "temurin"
        java-version: "17"
        cache: "gradle"
    # The runner image has no NDK r28, so the build downloads ~1 GB of it
    # every time unless it comes from the cache.
    - id: ndk
      shell: bash
      run: echo "path=$ANDROID_HOME/ndk/$(sed -n 's/.*ndkVersion "\(.*\)".*/\1/p' android/app/build.gradle)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ${{ steps.ndk.outputs.path }}
        key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.path }}
    - shell: bash
      run: flutter pub get

name: "ci"

on:
  push:
    branches:
      - "master"
    # The working branch (v3.0) runs nothing on push: a v* tag runs it
    # all, and also builds the signed Play bundle (job `play-bundle`).
    tags:
      - "v*"
  pull_request:
    branches:
      - "v3.0"
      - "master"

# A newer push to the same branch or pull request makes an older run moot.
# Tag runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  analyze-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Nested pub workspaces (packages/*, tools/) resolve their own deps.
      # `flutter analyze` walks the whole tree, so it needs these fetched
      # first or it reports every `package:test` import as unresolved.
      - name: pub get in packages/* and tools/
        run: |
          for d in packages/*/ tools/; do
            (cd "$d" && dart pub get)
          done
      - run: flutter analyze
      - name: flutter test (excluding test/integration, needs a live server)
        run: flutter test $(find test -name '*_test.dart' ! -path 'test/integration/*')
      - name: dart test in packages/*
        run: |
          for d in packages/*/; do
            [ -d "$d/test" ] || continue  # vartalap_proto is generated code with no tests
            echo "== dart test: $d =="
            (cd "$d" && dart test)
          done
      - name: dart analyze tools/
        run: (cd tools && dart analyze)

  degoogle:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/degoogle_gate.sh

  # DECISIONS 121, 209: the foss build (F-Droid, GitHub: APKs, never a
  # bundle) must hold no Google code; this proves it on every run. The gms
  # side is the Play bundle, checked by the play-bundle job on each v* tag.
  # arm64 only: the gate reads dex, not native code.
  apk:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # Dev builds only: a throwaway key, so `--release` (which
      # android/app/build.gradle always signs with signingConfigs.release)
      # has something to sign with. Releases are the play-bundle job's.
      - name: Generate throwaway signing key
        run: |
          keytool -genkeypair -v -keystore ci-release.jks -alias ciupload \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-throwaway -keypass ci-throwaway \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"
          cat > android/key.properties <<EOF
          storePassword=ci-throwaway
          keyPassword=ci-throwaway
          keyAlias=ciupload
          storeFile=${{ github.workspace }}/ci-release.jks
          EOF
      - name: Build the dev foss APK
        run: |
          flutter build apk --release --flavor devFoss --target-platform android-arm64 \
            --dart-define=API_URL=${{ vars.API_URL || 'https://vartalapapp.one9x.com' }} \
            --dart-define=WS_URL=${{ vars.WS_URL || 'wss://vartalapapp.one9x.com/wss' }} \
            --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN || '' }}
      # Release plan §5: the shipped classes.dex is the release-time half of
      # the degoogle gate: no Firebase, Play services or embedded FCM classes.
      - name: Verify the APK's classes (degoogle gate)
        run: bash scripts/degoogle_gate.sh apk build/app/outputs/flutter-apk/app-devfoss-release.apk foss
      - uses: actions/upload-artifact@v7
        with:
          name: vartalap-dev-foss-release-apk
          path: build/app/outputs/flutter-apk/app-devfoss-release.apk

  # Decision 211: a v* tag builds the Play bundle, signed with the upload key
  # and carrying the Firebase config (decision 209). The secrets live in the
  # `release` environment, which only v* tags may deploy to.
  play-bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Upload key and Firebase config
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FIREBASE: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          EOF
          printf '%s' "$FIREBASE" | base64 -d > "$RUNNER_TEMP/google-services.json"
          python3 scripts/firebase_config.py "$RUNNER_TEMP/google-services.json"
      - name: Build the Play bundle
        run: flutter build appbundle --release --flavor prodGms
      # Play refuses a bundle signed with any other key; fail here instead.
      - name: Signed with the upload key, and its classes (degoogle gate)
        run: |
          AAB=build/app/outputs/bundle/prodGmsRelease/app-prod-gms-release.aab
          keytool -printcert -jarfile "$AAB" \
            | grep -q "SHA256: ${{ vars.UPLOAD_CERT_SHA256 || '40:AF:41:D1:F2:49:5A:62:A9:71:F3:82:84:D2:9E:39:69:62:A1:86:E7:75:9A:83:E4:09:91:07:8B:57:EF:A7' }}"
          bash scripts/degoogle_gate.sh apk "$AAB" gms
      - uses: actions/upload-artifact@v7
        with:
          name: vartalap-${{ github.ref_name }}-play-bundle
          path: build/app/outputs/bundle/prodGmsRelease/app-prod-gms-release.aab

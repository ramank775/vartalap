name: "ci"

# Decision 213: nothing runs on pushes to the working branch (v3.0).
# A pull request or a push to master is checked; a v* tag is checked and
# released in one job (decisions 211, 216).
on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - "v3.0"
      - "master"

# A newer push to the same branch or pull request makes an older run moot.
# Tag runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  check:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Cached per pull request: later pushes to it reuse the SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ./.github/actions/check

  # A v* tag: set up once, check, then build what gets published, both signed
  # with the upload key: the Play bundle (prodGms, with the Firebase config of
  # decision 209) and the foss APK (prodFoss: GitHub, F-Droid). The secrets
  # live in the `release` environment, which only v* tags may deploy to.
  #
  # No caches: GitHub shows a tag run only its own caches and the default
  # branch's (master, which runs nothing), so what one tag saved, the next
  # could never restore. Gradle installs the NDK itself.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    environment: release
    env:
      AAB: build/app/outputs/bundle/prodGmsRelease/app-prod-gms-release.aab
      APK: build/app/outputs/flutter-apk/app-prodfoss-release.apk
      # The upload key's certificate; Play refuses a bundle signed with any other.
      UPLOAD_CERT_SHA256: ${{ vars.UPLOAD_CERT_SHA256 || '40:AF:41:D1:F2:49:5A:62:A9:71:F3:82:84:D2:9E:39:69:62:A1:86:E7:75:9A:83:E4:09:91:07:8B:57:EF:A7' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: ./.github/actions/check
      - name: Upload key and Firebase config
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FIREBASE: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          EOF
          printf '%s' "$FIREBASE" | base64 -d > "$RUNNER_TEMP/google-services.json"
          python3 scripts/firebase_config.py "$RUNNER_TEMP/google-services.json"
      - run: flutter build appbundle --release --flavor prodGms
      - run: flutter build apk --release --flavor prodFoss
      - name: Signed with the upload key; Google code only in the bundle
        run: |
          keytool -printcert -jarfile "$AAB" | grep -q "SHA256: $UPLOAD_CERT_SHA256"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$APK" \
            | grep -q "SHA-256 digest: $(echo "$UPLOAD_CERT_SHA256" | tr -d : | tr A-F a-f)"
          bash scripts/degoogle_gate.sh apk "$AAB" gms
          bash scripts/degoogle_gate.sh apk "$APK" foss
      - uses: actions/upload-artifact@v7
        with:
          name: vartalap-${{ github.ref_name }}
          # R8's mapping files: to read the Android stack of a crash report
          path: |
            ${{ env.AAB }}
            ${{ env.APK }}
            build/app/outputs/mapping/*Release/mapping.txt

name: "ci"

on:
  push:
    branches:
      - "v3.0"
      - "master"
  pull_request:
    branches:
      - "v3.0"
      - "master"

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      # Nested pub workspaces (packages/*, tools/) resolve their own deps.
      # `flutter analyze` walks the whole tree, so it needs these fetched
      # first or it reports every `package:test` import as unresolved.
      - name: pub get in packages/* and tools/
        run: |
          for d in packages/*/ tools/; do
            (cd "$d" && dart pub get)
          done
      - run: flutter analyze
      - name: flutter test (excluding test/integration, needs a live server)
        run: flutter test $(find test -name '*_test.dart' ! -path 'test/integration/*')
      - name: dart test in packages/*
        run: |
          for d in packages/*/; do
            [ -d "$d/test" ] || continue  # vartalap_proto is generated code with no tests
            echo "== dart test: $d =="
            (cd "$d" && dart test)
          done
      - name: dart analyze tools/
        run: (cd tools && dart analyze)

  degoogle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/degoogle_gate.sh

  apk:
    runs-on: ubuntu-latest
    # DECISIONS 121: foss (no Google code) and gms (adds the embedded FCM
    # distributor) are separate APKs; each gets its own dex check.
    strategy:
      matrix:
        push: [foss, gms]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
      - run: flutter pub get
      # ponytail: no release signing secrets configured yet. Generate a
      # throwaway debug keystore so `--release` (which android/app/build.gradle
      # always points at signingConfigs.release) has something to sign with.
      # Swap for a real secrets-backed keystore + key.properties when this
      # app actually ships to a store.
      - name: Generate throwaway signing key
        run: |
          keytool -genkeypair -v -keystore ci-release.jks -alias ciupload \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-throwaway -keypass ci-throwaway \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"
          cat > android/key.properties <<EOF
          storePassword=ci-throwaway
          keyPassword=ci-throwaway
          keyAlias=ciupload
          storeFile=${{ github.workspace }}/ci-release.jks
          EOF
      - name: Build the dev ${{ matrix.push }} release APK
        run: |
          flutter build apk --release --flavor dev${{ matrix.push == 'foss' && 'Foss' || 'Gms' }} \
            --dart-define=API_URL=${{ vars.API_URL || 'https://vartalapapp.one9x.org' }} \
            --dart-define=WS_URL=${{ vars.WS_URL || 'wss://vartalapapp.one9x.org/wss' }} \
            --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN || '' }}
      # Release plan §5: the shipped classes.dex is the release-time half of
      # the degoogle gate. foss: no Firebase, Play services or embedded FCM
      # distributor classes; gms: no Firebase or Play services classes.
      - name: Verify the APK's classes (degoogle gate)
        run: bash scripts/degoogle_gate.sh apk build/app/outputs/flutter-apk/app-dev${{ matrix.push }}-release.apk ${{ matrix.push }}
      - uses: actions/upload-artifact@v7
        with:
          name: vartalap-dev-${{ matrix.push }}-release-apk
          path: build/app/outputs/flutter-apk/app-dev${{ matrix.push }}-release.apk
